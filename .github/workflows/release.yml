name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ''
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: verify Cargo.toml version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$cargo_ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME (== $tag) does not match Cargo.toml version $cargo_ver"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install musl tooling
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          name="wxupd-${{ github.ref_name }}-${{ matrix.target }}"
          cp target/${{ matrix.target }}/release/wxupd${{ matrix.ext }} "dist/${name}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Auto-built release for ${{ github.ref_name }}" \
            dist/*

  update-formula:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: rewrite formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          sha_arm=$(sha256sum dist/wxupd-${TAG}-aarch64-apple-darwin | awk '{print $1}')
          sha_intel=$(sha256sum dist/wxupd-${TAG}-x86_64-apple-darwin | awk '{print $1}')
          sha_linux=$(sha256sum dist/wxupd-${TAG}-x86_64-unknown-linux-musl | awk '{print $1}')
          python3 - "$version" "$sha_arm" "$sha_intel" "$sha_linux" <<'PY'
          import re, sys
          version, sha_arm, sha_intel, sha_linux = sys.argv[1:]
          path = "Formula/wxupd.rb"
          src = open(path).read()
          src = re.sub(r'version "[^"]+"', f'version "{version}"', src, count=1)
          # Order: aarch64 (arm), x86_64 darwin (intel), x86_64 linux.
          shas = [sha_arm, sha_intel, sha_linux]
          def replace_sha(match):
              replace_sha.idx += 1
              return f'sha256 "{shas[replace_sha.idx - 1]}"'
          replace_sha.idx = 0
          src = re.sub(r'sha256 "[0-9a-f]{64}"', replace_sha, src)
          open(path, "w").write(src)
          PY
      - name: commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/wxupd.rb; then
            echo "no formula change"
            exit 0
          fi
          git add Formula/wxupd.rb
          git commit -m "chore: bump Formula to ${{ github.ref_name }} [skip ci]"
          git push origin main
